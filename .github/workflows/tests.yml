name: Tests
on: [push, pull_request]
jobs:
  cpp:
    name: C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S CppParallelSuite -B CppParallelSuite/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build CppParallelSuite/build -j $(nproc)
      - name: Test
        working-directory: CppParallelSuite/build
        env:
          PSWEET_NTHREADS: "4"
        run: ctest --output-on-failure
  java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure
        run: cmake -S JavaParallelSuite -B JavaParallelSuite/build
      - name: Build
        run: cmake --build JavaParallelSuite/build
      - name: Test
        working-directory: JavaParallelSuite/build
        env:
          PSWEET_NTHREADS: "4"
        run: ctest --output-on-failure
